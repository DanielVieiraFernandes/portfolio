<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a1f">
  <meta name="description" content="Daniel Vieira, desenvolvedor full stack .NET. Um portfólio em forma de sistema operacional: abra o editor, o terminal e os projetos.">
  <title>DanielOS · Daniel Vieira, desenvolvedor .NET</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23120a1f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='30' fill='%2374f0c4'%3Edv%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/daniel-avatar.webp" type="image/webp">
  <link rel="stylesheet" href="os/os.css">
  <script defer src="os/content.js"></script>
  <script defer src="os/os.js"></script>
  <script defer src="os/sky.js"></script>
</head>
<body>
  <noscript>
    <div class="noscript">
      <p>Este portfólio em forma de sistema operacional precisa de JavaScript.</p>
      <p><a href="classic.html">Abrir a versão clássica do portfólio</a> ou <a href="Daniel_Vieira_Desenvolvedor.pdf">baixar o currículo (PDF)</a>.</p>
    </div>
  </noscript>

  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-inner">
      <span class="boot-logo">dv</span>
      <p class="boot-name">DanielOS</p>
      <div class="boot-bar"><i></i></div>
      <p class="boot-hint">Clique ou pressione qualquer tecla para pular</p>
    </div>
  </div>

  <div class="os" id="os">
    <header class="topbar">
      <button class="topbar-logo" id="start-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="start-menu"><span class="mini-logo" aria-hidden="true">dv</span><span>DanielOS</span></button>
      <span class="topbar-app" id="topbar-app">Área de trabalho</span>
      <span class="topbar-spacer"></span>
      <span class="topbar-status"><span class="pulse" aria-hidden="true"></span>Disponível para conversar</span>
      <time class="topbar-clock" id="clock"></time>
    </header>

    <div class="start-menu" id="start-menu" role="menu" hidden>
      <div class="start-head">
        <img src="assets/daniel-avatar.webp" alt="" width="56" height="56">
        <div><strong>Daniel Vieira</strong><span>Full stack .NET · Hortolândia, SP</span></div>
      </div>
      <div class="start-items" id="start-items"></div>
    </div>

    <main class="desktop" id="desktop" aria-label="Área de trabalho">
      <canvas class="sky" id="sky" aria-hidden="true"></canvas>
      <ul class="desktop-icons" id="desktop-icons" aria-label="Aplicativos"></ul>
      <div class="desktop-hello" aria-hidden="true">
        <p>Olá, eu sou o Daniel.</p>
        <p><span id="hello-verb">Dê dois cliques em</span> <strong>portfolio</strong> para abrir meu projeto no editor.</p>
      </div>
      <div class="windows" id="windows"></div>
    </main>

    <nav class="dock" id="dock" aria-label="Dock de aplicativos"></nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
