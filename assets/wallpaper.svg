<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
<!-- DanielOS wallpaper: a quiet night sky over the edge of a planet, lit by the
     mint and violet rim light of the portrait. Stars are drawn by os/sky.js. -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0717"/><stop offset=".75" stop-color="#1b1030"/><stop offset="1" stop-color="#24143d"/></linearGradient>
<radialGradient id="haze" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#b18cff" stop-opacity=".32"/><stop offset=".5" stop-color="#7a55d6" stop-opacity=".10"/><stop offset="1" stop-color="#7a55d6" stop-opacity="0"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset=".08" stop-color="#74f0c4" stop-opacity="0"/><stop offset=".3" stop-color="#74f0c4"/><stop offset=".55" stop-color="#b18cff"/><stop offset=".78" stop-color="#5aa2ff"/><stop offset=".95" stop-color="#5aa2ff" stop-opacity="0"/></linearGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150c26"/><stop offset=".12" stop-color="#0c0715"/></linearGradient>
<filter id="blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="1080" fill="url(#haze)"/>
<circle cx="960" cy="3060" r="2200" fill="none" stroke="url(#rim)" stroke-width="34" opacity=".55" filter="url(#blur)"/>
<circle cx="960" cy="3060" r="2200" fill="url(#ground)"/>
<circle cx="960" cy="3060" r="2200" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>